<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Demostración de reservas · AW-RiseCR</title>
<meta name="description" content="Demostración de AW-RiseCR: la web con reservas y el panel en el celular. Datos de ejemplo.">
<link rel="icon" href="img/aw-logo.png">
<style>
@font-face { font-family: "Barlow Condensed"; src: url(fuentes/barlow-condensed-600.woff2) format("woff2"); font-weight: 600; font-display: swap; }
@font-face { font-family: "Barlow Condensed"; src: url(fuentes/barlow-condensed-700.woff2) format("woff2"); font-weight: 700; font-display: swap; }
@font-face { font-family: "Outfit"; src: url(fuentes/outfit.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Fraunces"; src: url(fuentes/fraunces.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Inter"; src: url(fuentes/inter-latin-400-normal.woff2) format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Inter"; src: url(fuentes/inter-latin-500-normal.woff2) format("woff2"); font-weight: 500; font-display: swap; }
@font-face { font-family: "Inter"; src: url(fuentes/inter-latin-600-normal.woff2) format("woff2"); font-weight: 600; font-display: swap; }
@font-face { font-family: "JetBrains Mono"; src: url(fuentes/jetbrainsmono.woff2) format("woff2"); font-weight: 500; font-display: swap; }

:root {
  --f-texto: "Inter", system-ui, -apple-system, sans-serif;
  --f-num: "JetBrains Mono", ui-monospace, monospace;
  --linea: rgba(255, 255, 255, 0.09);
  --linea-f: rgba(255, 255, 255, 0.16);
  --listo: #5DBE8A;
  --aviso: #E9B44C;
}
body[data-nicho="rigo"] {
  --fondo: #0B1820; --fondo-rgb: 11, 24, 32; --sup: #13232D; --sup2: #1B303C;
  --texto: #F6EFE4; --apagado: #A9B6BE; --tenue: #7D8D96;
  --acento: #F7931E; --acento-rgb: 247, 147, 30; --sobre: #1A0E00;
  --f-tit: "Barlow Condensed", var(--f-texto); --tit-peso: 700; --tit-esp: 0.005em;
}
body[data-nicho="conchal"] {
  --fondo: #12110F; --fondo-rgb: 18, 17, 15; --sup: #1C1A17; --sup2: #27241F;
  --texto: #F5EFE3; --apagado: #B3ADA2; --tenue: #857F75;
  --acento: #3DA5E0; --acento-rgb: 61, 165, 224; --sobre: #04121B;
  --f-tit: "Outfit", var(--f-texto); --tit-peso: 600; --tit-esp: -0.02em;
}
body[data-nicho="masajes"] {
  --fondo: #15110E; --fondo-rgb: 21, 17, 14; --sup: #201A15; --sup2: #2B231C;
  --texto: #F3EBE1; --apagado: #B8A897; --tenue: #8A7C6E;
  --acento: #D4875C; --acento-rgb: 212, 135, 92; --sobre: #1E0F06;
  --f-tit: "Fraunces", Georgia, serif; --tit-peso: 500; --tit-esp: -0.02em;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; background: var(--fondo); color: var(--texto);
  font: 15px/1.45 var(--f-texto); -webkit-font-smoothing: antialiased;
  background-image: radial-gradient(900px 500px at 50% -10%, rgba(var(--acento-rgb), 0.10), transparent 70%);
  transition: background-color 0.3s;
}
button { font: inherit; color: inherit; }
.ico { width: 18px; height: 18px; flex: none; }
.mono { font-family: var(--f-num); font-weight: 500; letter-spacing: -0.02em; }

/* ---------- Página ---------- */
.barra { display: flex; align-items: center; gap: 16px; padding: 12px 24px; border-bottom: 1px solid var(--linea); flex-wrap: wrap; }
.marca { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; white-space: nowrap; }
.marca img { width: 30px; height: 30px; object-fit: contain; }
.marca small { color: var(--apagado); font-weight: 400; }
.nichos { margin-left: auto; display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--sup); border: 1px solid var(--linea); }
.nichos button { border: 0; background: none; cursor: pointer; padding: 8px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 500; color: var(--apagado); white-space: nowrap; }
.nichos button.activo { background: var(--acento); color: var(--sobre); }

.escena { display: flex; justify-content: center; align-items: flex-start; gap: 26px; padding: 18px 20px 6px; }
.col { display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 0; }
.col-cabeza { text-align: center; }
.col-cabeza small { font: 500 11px var(--f-num); letter-spacing: 0.14em; text-transform: uppercase; color: var(--acento); }
.col-cabeza h2 { margin: 2px 0 8px; font: var(--tit-peso) 23px/1.1 var(--f-tit); letter-spacing: var(--tit-esp); }
.pestanas { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.pestanas button { cursor: pointer; padding: 6px 12px; border-radius: 999px; font-size: 12.5px; background: none; border: 1px solid var(--linea-f); color: var(--apagado); }
.pestanas button.activo { border-color: var(--acento); color: var(--texto); background: rgba(var(--acento-rgb), 0.12); }
.col-nota { margin: 4px 0 0; max-width: 330px; min-height: 40px; text-align: center; font-size: 13px; color: var(--apagado); }

.puente { align-self: center; width: 104px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; font-size: 12px; color: var(--apagado); margin-top: 40px; }
.puente .via { position: relative; width: 92px; height: 2px; background: linear-gradient(90deg, rgba(var(--acento-rgb), 0.1), var(--acento)); }
.puente .via::after { content: ""; position: absolute; right: -1px; top: -4px; border: 5px solid transparent; border-left: 7px solid var(--acento); border-right: 0; }
.puente .punto { position: absolute; top: -4px; left: 0; width: 10px; height: 10px; border-radius: 50%; background: var(--acento); opacity: 0; box-shadow: 0 0 14px var(--acento); }
.puente.pulso .punto { animation: viaje 0.9s ease-in-out 2; }
@keyframes viaje { 0% { left: 0; opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { left: 84px; opacity: 0; } }

.pie { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; padding: 10px 20px 22px; font-size: 12px; color: var(--tenue); }
.pie button { background: none; border: 0; padding: 0; cursor: pointer; color: var(--apagado); text-decoration: underline; text-underline-offset: 3px; font-size: 12px; }

/* ---------- Celular ---------- */
.cel { flex: none; width: 375px; height: 790px; padding: 9px; border-radius: 54px; background: #070809; border: 1px solid rgba(255, 255, 255, 0.14); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), inset 0 0 0 2px #1a1c1f; zoom: var(--k, 1); }
.pantalla { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 45px; background: var(--fondo); isolation: isolate; }
.isla { position: absolute; z-index: 50; top: 11px; left: 50%; width: 108px; height: 31px; margin-left: -54px; border-radius: 20px; background: #000; pointer-events: none; }
.estado { position: absolute; z-index: 45; top: 0; left: 0; right: 0; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 4px 30px 0 36px; font: 600 15px var(--f-texto); pointer-events: none; color: #fff; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.35); }
.estado i { display: flex; gap: 5px; align-items: center; }
.estado i b { display: block; width: 24px; height: 11px; border: 1.5px solid #fff; border-radius: 4px; position: relative; }
.estado i b::after { content: ""; position: absolute; inset: 1.5px 5px 1.5px 1.5px; background: #fff; border-radius: 1.5px; }
.estado i s { display: block; width: 16px; height: 10px; background: linear-gradient(90deg, #fff 0 22%, transparent 22% 26%, #fff 26% 48%, transparent 48% 52%, #fff 52% 74%, transparent 74% 78%, #fff 78%); clip-path: polygon(0 100%, 100% 0, 100% 100%); }
.barra-inicio { position: absolute; z-index: 45; bottom: 8px; left: 50%; width: 128px; height: 5px; margin-left: -64px; border-radius: 3px; background: rgba(255, 255, 255, 0.55); pointer-events: none; }
.vista { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.vista::-webkit-scrollbar { display: none; }
.toque { position: absolute; z-index: 60; left: 14px; right: 14px; bottom: 100px; display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: rgba(28, 28, 30, 0.96); color: #f2f2f2; font-size: 13.5px; line-height: 1.4; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); animation: aparece 0.25s ease-out; }
.toque .ico { color: var(--acento); margin-top: 1px; }
@keyframes aparece { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- La web ---------- */
.boton { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 18px; border: 0; border-radius: 12px; cursor: pointer; background: var(--acento); color: var(--sobre); font-weight: 600; font-size: 15px; }
.boton.ancho { width: 100%; }
.boton.sec { background: none; color: var(--texto); border: 1px solid var(--linea-f); }
.w-nav { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px; padding: 50px 16px 10px; background: rgba(var(--fondo-rgb), 0.94); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: 1px solid var(--linea); }
.w-logo { display: flex; align-items: center; gap: 9px; cursor: pointer; }
.w-logo img { width: 40px; height: 40px; object-fit: contain; }
.w-logo b { font: var(--tit-peso) 20px/1 var(--f-tit); letter-spacing: var(--tit-esp); }
.w-logo .palabra { font: 500 24px/1 var(--f-tit); font-style: italic; color: var(--texto); }
.w-acc { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.w-idioma { cursor: pointer; padding: 5px 8px; border-radius: 7px; border: 1px solid var(--linea-f); background: none; font: 600 11px var(--f-texto); letter-spacing: 0.1em; color: var(--apagado); }
.w-menu { cursor: pointer; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; border: 0; background: var(--sup); }
.w-hero { position: relative; margin: 12px 12px 0; height: 400px; border-radius: 22px; overflow: hidden; display: flex; align-items: flex-end; }
.w-hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.w-hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(var(--fondo-rgb), 0.92) 88%); }
.w-hero div { position: relative; z-index: 1; padding: 22px 20px; }
.ceja { font: 500 11px var(--f-num); letter-spacing: 0.14em; text-transform: uppercase; color: var(--acento); }
.w-hero h1 { margin: 6px 0 8px; font: var(--tit-peso) 36px/1.02 var(--f-tit); letter-spacing: var(--tit-esp); }
.w-hero p { margin: 0 0 16px; color: var(--apagado); font-size: 14.5px; }
.w-confianza { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 16px 14px 2px; }
.w-confianza span { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; font-size: 11.5px; line-height: 1.3; color: var(--apagado); }
.w-confianza .ico { width: 22px; height: 22px; color: var(--acento); }
.w-sec { display: flex; justify-content: space-between; align-items: baseline; padding: 24px 18px 10px; }
.w-sec h3 { margin: 0; font: var(--tit-peso) 23px/1.1 var(--f-tit); letter-spacing: var(--tit-esp); }
.w-sec button { border: 0; background: none; cursor: pointer; color: var(--acento); font-size: 13px; font-weight: 500; padding: 0; }
.w-carrusel { display: flex; gap: 12px; overflow-x: auto; padding: 0 16px 4px; scroll-snap-type: x mandatory; scrollbar-width: none; }
.w-carrusel::-webkit-scrollbar { display: none; }
.tarjeta { flex: 0 0 218px; scroll-snap-align: start; cursor: pointer; overflow: hidden; border-radius: 16px; background: var(--sup); border: 1px solid var(--linea); text-align: left; padding: 0; }
.tarjeta img { display: block; width: 100%; height: 140px; object-fit: cover; }
.tarjeta div { padding: 11px 12px 13px; }
.tarjeta small { display: block; font-size: 12px; color: var(--tenue); }
.tarjeta b { display: block; margin: 2px 0 4px; font: var(--tit-peso) 19px/1.1 var(--f-tit); letter-spacing: var(--tit-esp); }
.tarjeta span { font-size: 13px; color: var(--apagado); }
.tarjeta strong { color: var(--texto); }
.w-lista { display: flex; flex-direction: column; gap: 10px; padding: 4px 14px 30px; }
.w-lista .tarjeta { display: grid; grid-template-columns: 112px 1fr; flex: none; width: 100%; }
.w-lista .tarjeta img { height: 100%; min-height: 108px; }
.w-cita { margin: 26px 16px 0; padding: 16px; border-radius: 16px; background: var(--sup); border: 1px solid var(--linea); }
.w-cita .estrellas { display: flex; gap: 2px; color: var(--acento); }
.w-cita .estrellas svg { width: 15px; height: 15px; }
.w-cita p { margin: 8px 0 0; font-size: 13.5px; color: var(--apagado); }
.w-equipo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 16px; }
.w-equipo div { padding: 14px 6px; border-radius: 14px; background: var(--sup); text-align: center; font-size: 13px; }
.w-equipo small { display: block; color: var(--tenue); font-size: 11.5px; }
.av { display: grid; place-items: center; width: 42px; height: 42px; margin: 0 auto 7px; border-radius: 50%; background: var(--sup2); border: 1px solid rgba(var(--acento-rgb), 0.45); color: var(--acento); font: 600 17px var(--f-tit); }
.w-pie { margin-top: 30px; padding: 22px 18px 44px; border-top: 1px solid var(--linea); font-size: 12.5px; color: var(--tenue); }
.w-pie b { display: block; color: var(--texto); font-size: 14px; margin-bottom: 4px; }

.w-foto { position: relative; height: 290px; }
.w-foto img { width: 100%; height: 100%; object-fit: cover; }
.w-foto::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.25), transparent 30%, transparent 60%, var(--fondo)); }
.w-volver { position: absolute; z-index: 3; top: 54px; left: 14px; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; border: 0; cursor: pointer; background: rgba(0, 0, 0, 0.45); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); color: #fff; }
.w-cuerpo { padding: 2px 18px 20px; }
.w-cuerpo h2 { margin: 6px 0 10px; font: var(--tit-peso) 32px/1.05 var(--f-tit); letter-spacing: var(--tit-esp); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; background: var(--sup); font-size: 12.5px; color: var(--apagado); }
.chip .ico { width: 15px; height: 15px; color: var(--acento); }
.w-precio { display: flex; align-items: baseline; gap: 8px; margin: 16px 0 4px; }
.w-precio b { font-family: var(--f-num); font-weight: 500; font-size: 28px; letter-spacing: -0.03em; }
.w-precio span { color: var(--apagado); font-size: 13px; }
.etq { margin: 20px 0 8px; font: 500 11px var(--f-num); letter-spacing: 0.14em; text-transform: uppercase; color: var(--tenue); }
.w-cuerpo p { margin: 0; color: var(--apagado); font-size: 14.5px; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.checks li { display: flex; gap: 9px; font-size: 14px; }
.checks .ico { color: var(--acento); margin-top: 1px; }
.w-por-que { margin-top: 18px; padding: 14px 15px; border-radius: 14px; background: var(--sup); border-left: 2px solid var(--acento); }
.w-por-que p { color: var(--texto); }
.w-fijo { position: sticky; bottom: 0; z-index: 5; padding: 14px 16px 28px; background: linear-gradient(transparent, var(--fondo) 28%); }

.w-titulo-form { display: flex; align-items: center; gap: 10px; }
.w-titulo-form h2 { margin: 0; font: var(--tit-peso) 22px/1 var(--f-tit); letter-spacing: var(--tit-esp); }
.w-titulo-form .w-volver { position: static; background: var(--sup); width: 34px; height: 34px; }
.w-form { padding: 4px 16px 24px; }
.sel, .entrada { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--linea-f); background: var(--sup); color: var(--texto); font: 500 15px var(--f-texto); -webkit-appearance: none; appearance: none; outline: none; }
.sel { background-image: linear-gradient(45deg, transparent 50%, var(--apagado) 50%), linear-gradient(135deg, var(--apagado) 50%, transparent 50%); background-position: calc(100% - 19px) 52%, calc(100% - 14px) 52%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px; }
.entrada:focus, .sel:focus { border-color: var(--acento); }
.entrada::placeholder { color: var(--tenue); }
.dias { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.dias::-webkit-scrollbar { display: none; }
.dia { flex: 0 0 52px; padding: 8px 0; border-radius: 12px; cursor: pointer; text-align: center; background: var(--sup); border: 1px solid var(--linea); }
.dia small { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--tenue); }
.dia b { font: 500 17px var(--f-num); }
.elegido { border-color: var(--acento) !important; background: rgba(var(--acento-rgb), 0.14) !important; }
.horas { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.horas.tres { grid-template-columns: repeat(3, 1fr); }
.hora { cursor: pointer; padding: 10px 12px; border-radius: 12px; text-align: left; background: var(--sup); border: 1px solid var(--linea); }
.hora b { display: block; font: 500 16px var(--f-num); }
.hora span { font-size: 11.5px; color: var(--apagado); }
.hora.lleno { opacity: 0.38; cursor: not-allowed; }
.hora.lleno span { color: var(--tenue); }
.vacio { padding: 12px; border-radius: 12px; background: var(--sup); color: var(--apagado); font-size: 13px; }
.pasos { display: flex; align-items: center; justify-content: space-between; padding: 6px; border-radius: 12px; background: var(--sup); border: 1px solid var(--linea); }
.pasos button { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; border: 0; cursor: pointer; background: var(--sup2); }
.pasos b { font: 500 18px var(--f-num); }
.pasos span { font-size: 13px; color: var(--apagado); font-weight: 400; margin-left: 6px; }
.masajistas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
.masajista { cursor: pointer; padding: 10px 2px 9px; border-radius: 12px; text-align: center; background: var(--sup); border: 1px solid var(--linea); font-size: 12.5px; }
.masajista .av { width: 38px; height: 38px; font-size: 15px; margin-bottom: 5px; }
.ayuda { margin-top: 6px; font-size: 12px; color: var(--tenue); }
.w-total { position: sticky; bottom: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 16px 30px; background: var(--sup); border-top: 1px solid var(--linea-f); }
.w-total small { display: block; font-size: 12px; color: var(--apagado); }
.w-total b { font: 500 23px var(--f-num); letter-spacing: -0.03em; }
.w-total .boton { padding: 13px 15px; font-size: 14.5px; }

.w-listo { padding: 86px 20px 40px; text-align: center; }
.ok { display: grid; place-items: center; width: 74px; height: 74px; margin: 0 auto 16px; border-radius: 50%; background: rgba(var(--acento-rgb), 0.15); color: var(--acento); animation: crece 0.4s ease-out; }
.ok .ico { width: 34px; height: 34px; }
@keyframes crece { from { transform: scale(0.6); opacity: 0; } to { transform: none; opacity: 1; } }
.w-listo h2 { margin: 0 0 6px; font: var(--tit-peso) 30px/1.05 var(--f-tit); letter-spacing: var(--tit-esp); }
.w-listo > p { margin: 0 auto; max-width: 290px; color: var(--apagado); font-size: 14px; }
.codigo { display: inline-block; margin: 14px 0 16px; padding: 6px 12px; border-radius: 8px; border: 1px dashed rgba(var(--acento-rgb), 0.6); font: 500 14px var(--f-num); color: var(--acento); }
.resumen { margin: 0 0 18px; padding: 4px 14px; border-radius: 14px; background: var(--sup); text-align: left; }
.resumen div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--linea); font-size: 13.5px; }
.resumen div:last-child { border: 0; }
.resumen dt { color: var(--apagado); }
.resumen dd { margin: 0; text-align: right; font-weight: 500; }

/* ---------- Panel ---------- */
.p-cabeza { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px; padding: 52px 14px 11px; background: rgba(var(--fondo-rgb), 0.95); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: 1px solid var(--linea); }
.p-sello { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 11px; overflow: hidden; background: var(--sup); border: 1px solid rgba(var(--acento-rgb), 0.45); color: var(--acento); font: italic 500 20px var(--f-tit); }
.p-sello img { width: 36px; height: 36px; object-fit: contain; }
.p-cabeza small { display: block; font: 500 10.5px var(--f-num); letter-spacing: 0.14em; text-transform: uppercase; color: var(--acento); }
.p-cabeza b { font-size: 16px; }
.p-campana { position: relative; margin-left: auto; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: var(--sup); }

/* ---------- Fechas y formatos ---------- */
const DIAS = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];
const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const HOY = new Date(); HOY.setHours(0, 0, 0, 0);
const fecha = (n) => { const d = new Date(HOY); d.setDate(d.getDate() + n); return d; };
const diaCorto = (n) => n === 0 ? "Hoy" : n === 1 ? "Mañana" : `${DIAS[fecha(n).getDay()]} ${fecha(n).getDate()}`;
const diaLargo = (n) => { const d = fecha(n); return `${DIAS[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()]}`; };
const miles = (v) => String(v).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
const plata = (v) => N.moneda === "$" ? `$${v}` : `₡${miles(v)}`;
const minutos = (h) => { const [a, b] = h.split(":").map(Number); return a * 60 + b; };
const yaPaso = (dia, h) => { if (dia !== 0) return false; const ahora = new Date(); return minutos(h) <= ahora.getHours() * 60 + ahora.getMinutes() + 30; };
const horaAhora = () => { const d = new Date(); return `${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`; };
const may = (t) => t.charAt(0).toUpperCase() + t.slice(1);
const inicial = (t) => t.trim().charAt(0).toUpperCase();
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- Estado ---------- */
let N, S;
const HORAS_MSJ = ["7:12", "7:48", "8:05", "Ayer", "Ayer", "Ayer", "Ayer", "Ayer", "Ayer", "Ayer", "Ayer", "Ayer", "Ayer"];

function cargar(id) {
  N = NICHOS[id];
  document.body.dataset.nicho = id;
  const modo = S ? S.modo : "panel";
  const reservas = N.reservas.map((r, i) => {
    const base = N.tipo === "tours"
      ? { item: r[0], dia: r[1], hora: r[2], pax: r[3], nombre: r[4], hotel: HOTELES[r[5]], estado: r[6] }
      : { item: r[0], dia: r[1], hora: r[2], min: r[3], masajista: r[4], nombre: r[5], estado: r[6] };
    return { ...base, id: `${N.prefijo}-0${130 + i}`, orden: i, msj: HORAS_MSJ[N.reservas.length - 1 - i] || "Ayer", leida: true, respuesta: null };
  });
  S = { nicho: id, modo, web: "inicio", item: N.items[0].id, vista: "dia", dia: 0, filtro: "todas", hoja: null, chat: null, form: null, reservas, sig: 143, ultima: null, nuevo: null, noti: null };
  document.querySelectorAll("#nichos button").forEach((b) => b.classList.toggle("activo", b.dataset.nicho === id));
  pintar();
}

function nuevoForm(item) {
  if (N.tipo === "tours") return { item, dia: 1, hora: null, pax: 2, hotel: HOTELES[0], nombre: "" };
  const it = N.items.find((x) => x.id === item);
  return { item, min: it.opciones[0][0], masajista: "cualquiera", dia: 1, hora: null, nombre: "" };
}

const itemDe = (id) => N.items.find((x) => x.id === id);
const activas = () => S.reservas.filter((r) => r.estado !== "cancelada");
const ocupados = (item, dia, hora) => activas().filter((r) => r.item === item && r.dia === dia && r.hora === hora).reduce((s, r) => s + r.pax, 0);
const conSistema = () => S.modo === "panel";
const precioMasaje = (r) => itemDe(r.item).opciones.find((o) => o[0] === r.min)[1];
const totalDe = (r) => N.tipo === "tours" ? r.pax * itemDe(r.item).precio : precioMasaje(r);
const libre = (m, dia, h) => !activas().some((r) => r.masajista === m && r.dia === dia && r.hora === h);
const nombreMas = (id) => (N.masajistas.find((m) => m.id === id) || {}).nombre || "";

function pintar(opc = {}) {

  document.getElementById("tituloPanel").textContent = conSistema() ? N.panel : N.panelWa;
  const pest = ["inicio", "lista", "detalle", "reservar"];

  document.getElementById("notaWeb").textContent = notaWeb();

}

  const t = N.tipo === "tours";
  return {
    inicio: t ? "Toca un tour para ver su página, o «Reservar» para probar la reserva." : "Toca una técnica para ver por qué funciona, o «Reservar» para probar.",

function notaPanel() {

  if (S.vista === "catalogo") return N.tipo === "tours" ? "Precios, horarios y cupos se cambian aquí, sin programador." : "El horario y los días libres de cada masajista.";
  return N.tipo === "tours" ? "Las salidas del día con sus cupos. Toque una reserva para confirmarla." : "Cada masajista ve sus citas del día. Toque una para confirmarla.";

function horasTours(f) {
  const it = itemDe(f.item);
  const opciones = it.horas.map((h) => {
    const quedan = it.cupo - ocupados(it.id, f.dia, h);
    const paso = yaPaso(f.dia, h);
    const cerrado = paso || (conSistema() && quedan <= 0);
    return { h, quedan, paso, cerrado };
  });
  if (!f.hora || (opciones.find((o) => o.h === f.hora) || {}).cerrado) f.hora = (opciones.find((o) => !o.cerrado) || {}).h || null;
  if (f.hora && conSistema()) { const q = opciones.find((o) => o.h === f.hora).quedan; if (f.pax > q) f.pax = q; }
  return `<div class="horas">${opciones.map((o) => {
    const txt = o.paso ? "Ya salió" : !conSistema() ? "Salida fija" : o.quedan <= 0 ? "Lleno" : `${o.quedan} cupos`;
    return `<button class="hora ${o.cerrado ? "lleno" : ""} ${f.hora === o.h ? "elegido" : ""}" data-a="${o.cerrado ? "" : "f-hora:" + o.h}"><b>${o.h}</b><span>${txt}</span></button>`;
  }).join("")}</div>${opciones.every((o) => o.cerrado) ? `<p class="ayuda">No quedan salidas este día. Pruebe otro día.</p>` : ""}`;
}

function horasMasajes(f) {
  const lista = N.horas.filter((h) => !yaPaso(f.dia, h)).filter((h) => !conSistema() || (f.masajista === "cualquiera" ? N.masajistas.some((m) => libre(m.id, f.dia, h)) : libre(f.masajista, f.dia, h)));
  if (!lista.includes(f.hora)) f.hora = lista[0] || null;
  if (!lista.length) return `<div class="vacio">No quedan horas este día. Pruebe otro día.</div>`;
  return `<div class="horas tres">${lista.map((h) => `<button class="hora ${f.hora === h ? "elegido" : ""}" data-a="f-hora:${h}"><b>${h}</b><span>${conSistema() ? "Libre" : "A confirmar"}</span></button>`).join("")}</div>`;
}

function webReservar() {
  const f = S.form;
  const it = itemDe(f.item);
  const t = N.tipo === "tours";
  let campos;
  if (t) {
    const horas = horasTours(f);
    const max = conSistema() && f.hora ? it.cupo - ocupados(it.id, f.dia, f.hora) : 20;
    campos = `
      <div class="etq">Tour</div><select class="sel" data-campo="item">${N.items.map((x) => `<option value="${x.id}" ${x.id === f.item ? "selected" : ""}>${x.nombre} · ${plata(x.precio)}</option>`).join("")}</select>
      <div class="etq">Día</div>${diasForm(f)}
      <div class="etq">Hora de salida</div>${horas}
      <div class="etq">Personas</div><div class="pasos"><button data-a="f-pax:-1">${ico("menos")}</button><b>${f.pax}<span>${f.pax === 1 ? "persona" : "personas"}</span></b><button data-a="f-pax:${f.pax < max ? 1 : 0}">${ico("mas")}</button></div>
      <div class="etq">Recogida en</div><select class="sel" data-campo="hotel">${HOTELES.map((h) => `<option ${h === f.hotel ? "selected" : ""}>${h}</option>`).join("")}</select>`;
  } else {
    horasMasajes(f);
    campos = `
      <div class="etq">Masaje</div><select class="sel" data-campo="item">${N.items.map((x) => `<option value="${x.id}" ${x.id === f.item ? "selected" : ""}>${x.nombre}</option>`).join("")}</select>
      ${it.opciones.length > 1 ? `<div class="etq">Duración</div><div class="horas">${it.opciones.map((o) => `<button class="hora ${f.min === o[0] ? "elegido" : ""}" data-a="f-min:${o[0]}"><b>${o[0]} min</b><span>${plata(o[1])}</span></button>`).join("")}</div>` : `<p class="ayuda">${it.opciones[0][0]} minutos · ${plata(it.opciones[0][1])}</p>`}
      <div class="etq">¿Con quién?</div><div class="masajistas">
        <button class="masajista ${f.masajista === "cualquiera" ? "elegido" : ""}" data-a="f-mas:cualquiera"><span class="av">${ico("grupo")}</span>Cualquiera</button>
        ${N.masajistas.map((m) => `<button class="masajista ${f.masajista === m.id ? "elegido" : ""}" data-a="f-mas:${m.id}"><span class="av">${inicial(m.nombre)}</span>${m.nombre}</button>`).join("")}
      </div>
      <div class="etq">Día</div>${diasForm(f)}
      <div class="etq">${conSistema() ? "Horas libres" : "Hora que prefieres"}</div>${horasMasajes(f)}`;
  }
  const total = t ? f.pax * it.precio : it.opciones.find((o) => o[0] === f.min)[1];
  const resumen = t ? `${f.pax} × ${plata(it.precio)} · ${diaCorto(f.dia)}${f.hora ? " " + f.hora : ""}` : `${f.min} min · ${diaCorto(f.dia)}${f.hora ? " " + f.hora : ""}`;
  const boton = conSistema() ? `Reservar ${ico("flecha")}` : `${ico("chat")} Enviar por WhatsApp`;
  return `<header class="w-nav"><div class="w-titulo-form"><button class="w-volver" data-a="ir:detalle">${ico("atras")}</button><h2>Reservar</h2></div><div class="w-acc">${N.logo ? `<img src="${N.logo}" alt="" style="width:34px;height:34px;object-fit:contain">` : ""}</div></header>
    <div class="w-form">${campos}
      <div class="etq">Tu nombre</div><input class="entrada" data-campo="nombre" placeholder="${t ? "Ej. Emily Carter" : "Ej. Laura Mora"}" value="${esc(f.nombre)}" autocomplete="off">
      ${conSistema() ? "" : `<p class="ayuda">Al tocar el botón se abre WhatsApp con la reserva ya escrita.</p>`}
    </div>
    <div class="w-total"><div><small>${resumen}</small><b>${plata(total)}</b></div><button class="boton" data-a="${f.hora ? "confirmar" : "aviso:Elija un día con horas disponibles."}">${boton}</button></div>`;
}

function webListo() {
  const r = S.ultima;
  const it = itemDe(r.item);
  const filas = N.tipo === "tours"
    ? [["Tour", it.nombre], ["Fecha", `${diaLargo(r.dia)} · ${r.hora}`], ["Personas", r.pax], ["Recogida", r.hotel], ["Total", plata(totalDe(r))]]
    : [["Masaje", `${it.nombre} · ${r.min} min`], ["Masajista", nombreMas(r.masajista)], ["Fecha", `${diaLargo(r.dia)} · ${r.hora}`], ["Total", plata(totalDe(r))]];
  const titulo = conSistema() ? "¡Reserva recibida!" : "Reserva enviada por WhatsApp";
  const texto = conSistema()
    ? `${N.tipo === "tours" ? "Tu lugar quedó apartado." : "Tu hora quedó apartada."} Te llega la confirmación por WhatsApp y un recordatorio el día antes.`
    : "Tu reserva le llegó completa al negocio. Te confirman por WhatsApp en unos minutos.";
  return `<div class="w-listo"><div class="ok">${ico("check")}</div><h2>${titulo}</h2><p>${texto}</p>
    <span class="codigo">${r.id}</span>
    <dl class="resumen">${filas.map(([a, b]) => `<div><dt>${a}</dt><dd>${esc(b)}</dd></div>`).join("")}</dl>
    <button class="boton sec ancho" data-a="ir:inicio">Volver al inicio</button></div>`;
}

function pintarWeb(subir) {
  const el = document.getElementById("web");
  const vieja = el.querySelector(".vista");
  const pos = vieja ? vieja.scrollTop : 0;
  const html = { inicio: webInicio, lista: webLista, detalle: webDetalle, reservar: webReservar, listo: webListo }[S.web]();
  el.innerHTML = `${CROMO}<div class="vista">${html}</div>`;
  if (!subir) el.querySelector(".vista").scrollTop = pos;
}

/* ---------- El panel ---------- */
function cabezaPanel() {
  const pend = activas().filter((r) => r.estado === "pendiente").length;
  const sello = N.logo ? `<span class="p-sello"><img src="${N.logo}" alt=""></span>` : `<span class="p-sello">B</span>`;
  const quien = N.tipo === "tours" ? N.nombre : "Bálsamo · equipo";
  return `<header class="p-cabeza">${sello}<div><small>Panel de reservas</small><b>${quien}</b></div><span class="p-campana">${ico("campana")}${pend ? `<em>${pend}</em>` : ""}</span></header>`;
}

function diasPanel() {
  return `<div class="p-dias">${[0, 1, 2, 3, 4, 5, 6].map((n) => { const d = fecha(n); const hay = activas().some((r) => r.dia === n); return `<button class="p-dia ${S.dia === n ? "activo" : ""}" data-a="p-dia:${n}"><small>${n === 0 ? "hoy" : DIAS[d.getDay()]}</small><b>${d.getDate()}</b>${hay ? "<i></i>" : ""}</button>`; }).join("")}</div>`;
}

function filaReserva(r) {
  const nueva = S.nuevo === r.id;
  return `<button class="p-res ${nueva ? "nuevo" : ""}" data-a="p-res:${r.id}"><span class="p-ini">${inicial(r.nombre)}</span><div><b>${esc(r.nombre)}${nueva ? '<span class="tag-nueva">Nueva</span>' : ""}</b><small>${r.pax} ${r.pax === 1 ? "persona" : "personas"} · ${esc(r.hotel)}</small></div><em class="est ${r.estado}">${etiquetaEstado(r.estado)}</em></button>`;
}
const etiquetaEstado = (e) => ({ confirmada: "Confirmada", pendiente: "Por confirmar", cancelada: "Cancelada" }[e]);

function panelDia() {
  const delDia = S.reservas.filter((r) => r.dia === S.dia);
  const vivas = delDia.filter((r) => r.estado !== "cancelada");
  const pend = vivas.filter((r) => r.estado === "pendiente").length;
  let cuerpo, stats;
  if (N.tipo === "tours") {
    const grupos = {};
    delDia.forEach((r) => { const k = `${r.hora}|${r.item}`; (grupos[k] = grupos[k] || []).push(r); });
    const claves = Object.keys(grupos).sort();
    stats = [[vivas.length, "Reservas"], [vivas.reduce((s, r) => s + r.pax, 0), "Personas"], [pend, "Por confirmar", "pend"]];
    cuerpo = claves.length ? claves.map((k) => {
      const [hora, id] = k.split("|");
      const it = itemDe(id);
      const ocup = ocupados(id, S.dia, hora);
      return `<article class="p-salida"><div class="p-salida-cab"><b>${hora}</b><div><strong>${it.nombre}</strong><span>Guía ${it.guia}</span></div><em class="${ocup >= it.cupo ? "lleno" : ""}">${ocup}/${it.cupo}${ocup >= it.cupo ? " · lleno" : ""}</em></div>
        <div class="p-barra"><i style="width:${Math.min(100, (ocup / it.cupo) * 100)}%"></i></div>${grupos[k].map(filaReserva).join("")}</article>`;
    }).join("") : `<div class="p-vacio">Sin reservas este día.</div>`;
  } else {
    const filtradas = delDia.filter((r) => S.filtro === "todas" || r.masajista === S.filtro).sort((a, b) => a.hora.localeCompare(b.hora));
    stats = [[vivas.length, "Citas"], [pend, "Por confirmar", "pend"], [plata(vivas.reduce((s, r) => s + totalDe(r), 0)).replace(".000", " mil"), "Del día"]];
    const chips = `<div class="p-filtro"><button class="${S.filtro === "todas" ? "activo" : ""}" data-a="p-filtro:todas">Todas</button>${N.masajistas.map((m) => `<button class="${S.filtro === m.id ? "activo" : ""}" data-a="p-filtro:${m.id}">${m.nombre}</button>`).join("")}</div>`;
    cuerpo = chips + (filtradas.length ? filtradas.map((r) => {
      const it = itemDe(r.item);
      const nueva = S.nuevo === r.id;
      return `<button class="p-cita ${nueva ? "nuevo" : ""}" data-a="p-res:${r.id}"><b class="mono">${r.hora}</b><div><b>${it.nombre} · ${r.min} min${nueva ? '<span class="tag-nueva">Nueva</span>' : ""}</b><small>${esc(r.nombre)}</small></div><div class="p-cita-der"><small class="p-mas"><i>${inicial(nombreMas(r.masajista))}</i>${nombreMas(r.masajista)}</small><em class="est ${r.estado}">${etiquetaEstado(r.estado)}</em></div></button>`;
    }).join("") : `<div class="p-vacio">${S.filtro === "todas" ? "Sin citas este día." : `${nombreMas(S.filtro)} no tiene citas este día.`}</div>`);
  }
  return `${diasPanel()}<div class="p-titulo"><h3>${may(diaCorto(S.dia))}</h3><span>${diaLargo(S.dia)}</span></div>
    <div class="p-stats">${stats.map(([v, t, c]) => `<div class="${c || ""}"><b class="${String(v).length > 6 ? "largo" : ""}">${v}</b><small>${t}</small></div>`).join("")}</div>
    <div class="p-lista">${cuerpo}</div>`;
}

function panelSemana() {
  const filas = [0, 1, 2, 3, 4, 5, 6].map((n) => {
    const v = activas().filter((r) => r.dia === n);
    const cant = N.tipo === "tours" ? v.reduce((s, r) => s + r.pax, 0) : v.length;
    return { n, v, cant };
  });
  const max = Math.max(1, ...filas.map((f) => f.cant));
  return `<div class="p-titulo" style="padding-top:16px"><h3>Esta semana</h3><span>${N.tipo === "tours" ? "personas por día" : "citas por día"}</span></div>
    <div class="p-semana">${filas.map((f) => `<button data-a="p-semana:${f.n}"><div><strong>${may(diaCorto(f.n))}</strong><small>${diaLargo(f.n)}</small></div><div class="p-barra"><i style="width:${(f.cant / max) * 100}%"></i></div><em>${f.cant} ${N.tipo === "tours" ? "pax" : f.cant === 1 ? "cita" : "citas"}</em></button>`).join("")}</div>`;
}

function panelCatalogo() {
  if (N.tipo === "tours") {
    return `<div class="p-titulo" style="padding-top:16px"><h3>Tours</h3><span>${N.items.length} activos</span></div>
      <div class="p-cat">${N.items.map((it) => `<div class="p-cat-fila"><img src="${it.img}" alt=""><div><b>${it.nombre}</b><small>${plata(it.precio)} · ${it.horas.join(" y ")} · ${it.cupo} cupos</small></div><button data-a="aviso:Aquí se cambia el precio, los horarios, los cupos y las fotos de «${it.nombre}». La web se actualiza sola.">Editar</button></div>`).join("")}
      <p class="p-cat-nota">Un tour nuevo se agrega desde aquí, con sus fotos, precio, horarios y cupos, sin rediseñar nada.</p></div>`;
  }
  return `<div class="p-titulo" style="padding-top:16px"><h3>Equipo</h3><span>citas de hoy</span></div>
    <div class="p-cat">${N.masajistas.map((m) => { const hoy = activas().filter((r) => r.dia === 0 && r.masajista === m.id).length; return `<div class="p-cat-fila"><span class="av">${inicial(m.nombre)}</span><div><b>${m.nombre}</b><small>${m.hace} · 9:00 a 18:00 · ${hoy} ${hoy === 1 ? "cita" : "citas"} hoy</small></div><button data-a="aviso:Aquí se cambia el horario, los días libres y las técnicas de ${m.nombre}.">Horario</button></div>`; }).join("")}
    <p class="p-cat-nota">Cada masajista entra con su propio acceso y ve solo su agenda. La administración ve la de todas.</p></div>`;
}

function hojaReserva() {
  const r = S.reservas.find((x) => x.id === S.hoja);
  if (!r) return "";
  const it = itemDe(r.item);
  const filas = N.tipo === "tours"
    ? [["Fecha", `${diaLargo(r.dia)} · ${r.hora}`], ["Personas", r.pax], ["Recogida", r.hotel], ["Guía", it.guia], ["Total", plata(totalDe(r))], ["Estado", `<em class="est ${r.estado}">${etiquetaEstado(r.estado)}</em>`]]
    : [["Fecha", `${diaLargo(r.dia)} · ${r.hora}`], ["Duración", `${r.min} min`], ["Masajista", nombreMas(r.masajista)], ["Total", plata(totalDe(r))], ["Estado", `<em class="est ${r.estado}">${etiquetaEstado(r.estado)}</em>`]];
  const acciones = r.estado === "pendiente"
    ? `<button class="boton" data-a="p-confirmar:${r.id}">${ico("check")} Confirmar</button><button class="boton sec" data-a="p-cancelar:${r.id}">Rechazar</button>`
    : `<button class="boton sec" data-a="aviso:Se abre el chat de WhatsApp con ${esc(r.nombre)}.">${ico("chat")} WhatsApp</button><button class="boton sec" data-a="p-cerrar">Listo</button>`;
  return `<div class="velo" data-a="p-cerrar-fondo"><div class="hoja"><div class="agarre"></div>
    <div class="hoja-cab"><div><h3>${esc(r.nombre)}</h3><span class="codigo">${r.id}</span><div style="font-size:13.5px;color:var(--apagado)">${it.nombre}</div></div><button class="cerrar" data-a="p-cerrar">${ico("cerrar")}</button></div>
    <dl>${filas.map(([a, b]) => `<div><dt>${a}</dt><dd>${typeof b === "string" && b.startsWith("<em") ? b : esc(b)}</dd></div>`).join("")}</dl>
    <div class="hoja-acc">${acciones}</div></div></div>`;
}

function notificacion() {
  const r = S.reservas.find((x) => x.id === S.noti);
  if (!r) return "";
  const it = itemDe(r.item);
  const sello = N.logo ? `<span class="p-sello"><img src="${N.logo}" alt=""></span>` : `<span class="p-sello">B</span>`;
  const linea = N.tipo === "tours" ? `${esc(r.nombre)} · ${it.nombre} · ${diaCorto(r.dia)} ${r.hora} · ${r.pax} pers.` : `${esc(r.nombre)} · ${it.nombre} · con ${nombreMas(r.masajista)} · ${diaCorto(r.dia)} ${r.hora}`;
  return `<div class="noti" data-a="p-res:${r.id}">${sello}<div><small><span>${N.tipo === "tours" ? N.nombre : "Bálsamo"} · Panel</span><span>ahora</span></small><b>${N.tipo === "tours" ? "Nueva reserva" : "Nueva cita"}</b><span>${linea}</span></div></div>`;
}

/* ---------- WhatsApp (versión sin sistema) ---------- */
function mensaje(r) {
  const it = itemDe(r.item);
  const filas = N.tipo === "tours"
    ? [["Tour", it.nombre], ["Fecha", `${diaLargo(r.dia)} · ${r.hora}`], ["Personas", r.pax], ["Recogida", r.hotel], ["Nombre", r.nombre], ["Total", plata(totalDe(r))]]
    : [["Masaje", `${it.nombre} · ${r.min} min`], ["Masajista", nombreMas(r.masajista)], ["Fecha", `${diaLargo(r.dia)} · ${r.hora}`], ["Nombre", r.nombre], ["Total", plata(totalDe(r))]];
  return `<b>${N.tipo === "tours" ? "Nueva reserva" : "Nueva cita"} · ${r.id}</b><br>${filas.map(([a, b]) => `${a}: ${esc(b)}`).join("<br>")}`;
}

function waLista() {
  const chats = [...S.reservas].sort((a, b) => b.orden - a.orden).slice(0, 8);
  return `<header class="wa-cab"><h3>Chats</h3><small>WhatsApp de ${N.tipo === "tours" ? N.nombre : "Bálsamo"}</small><div class="wa-buscar">Buscar</div></header>
    ${chats.map((r) => `<button class="wa-chat ${r.leida ? "" : "sin-leer"} ${S.nuevo === r.id ? "nuevo" : ""}" data-a="wa-chat:${r.id}"><span class="wa-av">${inicial(r.nombre)}</span><div style="min-width:0"><b>${esc(r.nombre)}</b><p>${r.respuesta ? "Tú: " + r.respuesta.split(".")[0] : `${N.tipo === "tours" ? "Nueva reserva" : "Nueva cita"} · ${r.id} · ${itemDe(r.item).nombre}`}</p></div><div class="wa-chat-der">${r.msj}${r.leida ? "" : "<em>1</em>"}</div></button>`).join("")}`;
}

const RAPIDAS = ["Confirmar", "Pedir anticipo", "Ofrecer otra hora"];

function waChat() {
  const r = S.reservas.find((x) => x.id === S.chat);
  const cuerpo = `<header class="wa-conv-cab"><button data-a="wa-volver">${ico("atras")}</button><span class="wa-av">${inicial(r.nombre)}</span><div><b>${esc(r.nombre)}</b><small>en línea</small></div></header>
    <div class="wa-fondo"><div class="wa-fecha">${r.msj === "Ayer" ? "Ayer" : "Hoy"}</div>
      <div class="burbuja entra">${mensaje(r)}<time>${r.msj === "Ayer" ? "16:40" : r.msj}</time></div>
      ${r.respuesta ? `<div class="burbuja sale">${esc(r.respuesta)}<time>${r.horaRespuesta} ✓✓</time></div>` : ""}
    </div>`;
  const pie = `<div class="wa-pie">${r.respuesta ? "" : `<div class="wa-rapidas">${RAPIDAS.map((t, i) => `<button data-a="wa-resp:${r.id}:${i}">${t}</button>`).join("")}</div>`}<div class="wa-escribir"><span>Mensaje</span><i>${ico("mic")}</i></div></div>`;
  return { cuerpo, pie };
}


function pintarPanel(subir) {
  const el = document.getElementById("panel");
  const vieja = el.querySelector(".vista");
  const pos = vieja ? vieja.scrollTop : 0;
  let html;
  if (conSistema()) {
    const cuerpo = { dia: panelDia, semana: panelSemana, catalogo: panelCatalogo }[S.vista]();
    const tabs = [["dia", "cal", "Día"], ["semana", "semana", "Semana"], ["catalogo", "cuadros", N.tipo === "tours" ? "Tours" : "Equipo"]];
    html = `<div class="vista">${cabezaPanel()}${cuerpo}</div>
      <nav class="p-tabs">${tabs.map(([v, i, t]) => `<button class="${S.vista === v ? "activo" : ""}" data-a="p-vista:${v}">${ico(i)}${t}</button>`).join("")}</nav>
      ${S.hoja ? hojaReserva() : ""}${notificacion()}`;
  } else {
    if (S.chat) { const c = waChat(); html = `<div class="vista wa">${c.cuerpo}</div>${c.pie}`; }
    else html = `<div class="vista wa">${waLista()}</div>`;
  }
  el.innerHTML = `${CROMO}${html}`;
  if (!subir) el.querySelector(".vista").scrollTop = pos;
}

/* ---------- Acciones ---------- */
let reloj;
function aviso(donde, texto) {
  const el = document.getElementById(donde);
  el.querySelectorAll(".toque").forEach((t) => t.remove());
  el.insertAdjacentHTML("beforeend", `<div class="toque">${ico("info")}<span>${esc(texto)}</span></div>`);
  clearTimeout(reloj);
  reloj = setTimeout(() => el.querySelectorAll(".toque").forEach((t) => t.remove()), 3200);
}

function confirmar() {
  const f = S.form;
  const nombre = f.nombre.trim() || (N.tipo === "tours" ? "Emily Carter" : "Laura Mora");
  let r;
  if (N.tipo === "tours") {
    r = { item: f.item, dia: f.dia, hora: f.hora, pax: f.pax, nombre, hotel: f.hotel };
  } else {
    let m = f.masajista;
    if (m === "cualquiera") m = (N.masajistas.find((x) => libre(x.id, f.dia, f.hora)) || N.masajistas[0]).id;
    r = { item: f.item, dia: f.dia, hora: f.hora, min: f.min, masajista: m, nombre };
  }
  Object.assign(r, { id: `${N.prefijo}-0${S.sig++}`, estado: "pendiente", orden: S.reservas.length + 100, msj: horaAhora(), leida: false, respuesta: null });
  S.reservas.push(r);
  S.ultima = r;
  S.web = "listo";
  S.nuevo = r.id;
  S.dia = r.dia;
  S.vista = "dia";
  S.hoja = null;
  S.chat = null;
  if (N.tipo === "masajes") S.filtro = "todas";
  pintar({ subirWeb: true, subirPanel: true });
  const puente = document.getElementById("puente");
  puente.classList.remove("pulso"); void puente.offsetWidth; puente.classList.add("pulso");
  setTimeout(() => {
    if (!conSistema()) return;
    S.noti = r.id; pintarPanel();
    setTimeout(() => { if (S.noti === r.id) { S.noti = null; pintarPanel(); } }, 4500);
  }, 900);
  if (window.innerWidth <= 900) setTimeout(() => document.getElementById("panel").scrollIntoView({ behavior: "smooth", block: "center" }), 700);
}

function accion(a, e) {
  const [tipo, ...resto] = a.split(":");
  const val = resto.join(":");
  switch (tipo) {
    case "pest":
      if (val === "reservar") { S.form = nuevoForm(S.item); S.web = "reservar"; }
      else S.web = val;
      return pintar({ subirWeb: true });
    case "ir": S.web = val; return pintar({ subirWeb: true });
    case "ver": S.item = val; S.web = "detalle"; return pintar({ subirWeb: true });
    case "reservar": S.item = val || S.item; S.form = nuevoForm(val || S.item); S.web = "reservar"; return pintar({ subirWeb: true });
    case "f-dia": S.form.dia = Number(val); S.form.hora = null; return pintar();
    case "f-hora": S.form.hora = val; return pintar();
    case "f-pax": S.form.pax = Math.max(1, S.form.pax + Number(val)); if (Number(val) === 0) aviso("web", "No quedan más cupos en esa salida."); return pintar();
    case "f-min": S.form.min = Number(val); return pintar();
    case "f-mas": S.form.masajista = val; return pintar();
    case "confirmar": return confirmar();
    case "aviso": return aviso(e.target.closest("#panel") ? "panel" : "web", val);
    case "p-dia": S.dia = Number(val); S.nuevo = null; return pintar();
    case "p-vista": S.vista = val; S.hoja = null; return pintar({ subirPanel: true });
    case "p-semana": S.dia = Number(val); S.vista = "dia"; return pintar({ subirPanel: true });
    case "p-filtro": S.filtro = val; return pintar();
    case "p-res": S.hoja = val; S.noti = null; if (S.nuevo === val) S.nuevo = null; { const r = S.reservas.find((x) => x.id === val); if (r) S.dia = r.dia; S.vista = "dia"; } return pintar();
    case "p-cerrar": S.hoja = null; return pintar();
    case "p-cerrar-fondo": if (e.target.classList.contains("velo")) { S.hoja = null; pintar(); } return;
    case "p-confirmar": S.reservas.find((x) => x.id === val).estado = "confirmada"; S.hoja = null; pintar(); return aviso("panel", "Reserva confirmada. Al cliente le llega la confirmación por WhatsApp.");
    case "p-cancelar": S.reservas.find((x) => x.id === val).estado = "cancelada"; S.hoja = null; pintar(); return aviso("panel", "Reserva rechazada. El cupo queda libre otra vez en la web.");
    case "wa-chat": { const r = S.reservas.find((x) => x.id === val); r.leida = true; S.chat = val; if (S.nuevo === val) S.nuevo = null; return pintar({ subirPanel: true }); }
    case "wa-volver": S.chat = null; return pintar({ subirPanel: true });
    case "wa-resp": {
      const [id, i] = val.split(":");
      const r = S.reservas.find((x) => x.id === id);
      r.respuesta = respuestaTexto(r, Number(i));
      r.horaRespuesta = horaAhora();
      if (Number(i) === 0) r.estado = "confirmada";
      return pintar();
    }
  }
}

function respuestaTexto(r, i) {
  const primerNombre = r.nombre.split(" ")[0];
  const t = N.tipo === "tours"
    ? [`¡Hola ${primerNombre}! Tu reserva ${r.id} está confirmada. Te recogemos en ${r.hotel} 30 minutos antes. ¡Pura vida!`, `¡Hola ${primerNombre}! Para apartar tu reserva ${r.id}, el anticipo es de ${plata(Math.round(totalDe(r) * 0.3))} por SINPE o PayPal.`, `¡Hola ${primerNombre}! Esa salida está llena. ¿Te sirve otro horario el mismo día?`]
    : [`¡Hola ${primerNombre}! Tu cita ${r.id} con ${nombreMas(r.masajista)} está confirmada para el ${diaLargo(r.dia)} a las ${r.hora}. ¡Te esperamos!`, `¡Hola ${primerNombre}! Para apartar tu cita, el anticipo es de ${plata(totalDe(r) / 2)} por SINPE.`, `¡Hola ${primerNombre}! A esa hora no hay espacio. ¿Te sirve un poco más tarde?`];
  return t[i];
}

document.addEventListener("click", (e) => {
  const n = e.target.closest("[data-nicho]");
  if (n && n.tagName === "BUTTON") return cargar(n.dataset.nicho);
  const m = e.target.closest("[data-modo]");
  if (m) { S.modo = m.dataset.modo; S.hoja = null; S.chat = null; S.noti = null; if (S.form) S.form.hora = null; return pintar({ subirPanel: true }); }
  if (e.target.closest("#reiniciar")) return cargar(S.nicho);
  const b = e.target.closest("[data-a]");
  if (b && b.dataset.a) accion(b.dataset.a, e);
});

document.addEventListener("change", (e) => {
  const c = e.target.dataset.campo;
  if (!c || !S.form) return;
  if (c === "item") { const nombre = S.form.nombre; S.form = nuevoForm(e.target.value); S.form.nombre = nombre; S.item = e.target.value; }
  else S.form[c] = e.target.value;
  pintar();
});
document.addEventListener("input", (e) => { if (e.target.dataset.campo === "nombre" && S.form) S.form.nombre = e.target.value; });

/* Ajusta el tamaño de los celulares a la pantalla. */
function escalar() {
  const ancho = window.innerWidth, alto = window.innerHeight;
  const k = ancho <= 900 ? Math.min(1, (ancho - 24) / 395) : Math.max(0.6, Math.min(1, (alto - 250) / 790, (ancho - 230) / 790));
  document.documentElement.style.setProperty("--k", k.toFixed(3));
}
window.addEventListener("resize", escalar);
escalar();

const pedido = new URLSearchParams(location.search).get("negocio");
cargar(NICHOS[pedido] ? pedido : "rigo");
</script>
